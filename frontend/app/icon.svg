<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#000000"/>

  <defs>
    <mask id="moon">
      <circle cx="27" cy="5" r="4.5" fill="white"/>
      <circle cx="29.5" cy="3.5" r="3.6" fill="black"/>
    </mask>
  </defs>

  <!-- Grosse étoile rose -->
  <polygon
    points="14,5 17,13 25.4,13.3 19,18.6 21,26.7 14,22.2 7,26.7 9,18.6 2.6,13.3 11,13"
    fill="#C8587A"
  />

  <!-- Petite lune croissant (coin haut-droit) -->
  <circle cx="27" cy="5" r="4.5" fill="#C8587A" mask="url(#moon)"/>
</svg>
