services:
  annablanc-db:
    image: postgres:16-alpine
    container_name: annablanc-db
    restart: unless-stopped
    env_file:
      - ./.env.db
    volumes:
      - annablanc-pgdata:/var/lib/postgresql/data
    networks:
      - annablanc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annablanc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Europe/Paris
    depends_on:
      annablanc-db:
        condition: service_healthy
    networks:
      - annablanc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: annablanc-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    environment:
      API_URL: http://backend:3203
    ports:
      - "127.0.0.1:3202:3202"
    depends_on:
      - backend
    networks:
      - annablanc-net

networks:
  annablanc-net:
    driver: bridge

volumes:
  annablanc-pgdata:
